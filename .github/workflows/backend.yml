# Backend CI: formatting, vet, generated-code freshness and all tests against
# Postgres+PostGIS and Redis (same images as dev/docker-compose.yml).
# Only the two tools the contracts job runs are in the path filter; tools/tokens and tools/i18n
# belong to the mobile workflow.
name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", "tools/list-endpoints.py", "tools/bundle-specs.py", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", "tools/list-endpoints.py", "tools/bundle-specs.py", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: make check
        run: make check

  contracts:
    # contracts/ENDPOINTS.md and the bundled client specs are generated; fail if someone edited a spec and
    # didn't run `make specs` (or `make backend-specs` from the root).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Generated contract files are up to date
        run: |
          python3 tools/list-endpoints.py
          python3 tools/bundle-specs.py --check
          git diff --exit-code -- contracts/ENDPOINTS.md
