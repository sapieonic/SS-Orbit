openapi: 3.0.3
info:
  title: Orbit Farmers API
  version: 0.1.0
  description: >-
    Farmers, consents, plots and crop seasons: the farmer -> plot -> season spine
    every farm record hangs off (SYS-03). The farmer app reads and edits its own
    record under /v1/farmer; the HO portal lists, inspects, edits, deactivates and
    reassigns farmers under /v1/admin (roles: all read, ops and admin write; HO users
    with an area scope only see farmers in their districts). FA writes arrive as
    offline sync commands (EnrolFarmer, RecordConsent, SavePlot, StartSeason,
    UpdateFarmer), not over this API; the FA app only checks a phone number here
    before enrolling and gets upload URLs for farmer photos. Paths are absolute; the surface guard enforces token kind by prefix.
tags:
  - name: farmer-app
  - name: fa-farmers
  - name: admin-farmers
security:
  - bearerAuth: []
paths:
  /v1/farmer/me:
    get:
      operationId: getMyHome
      summary: Farmer home
      description: >-
        The signed-in farmer's profile, plots with their active season and current
        crop stage, the assigned FA card and the next planned FA visit.
      tags: [farmer-app]
      responses:
        '200':
          description: Home data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerHome'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMyProfile
      summary: Update my profile
      description: >-
        Name, language and photo. The village is changed through the FA or HO. photo_key must be
        a key returned by POST /v1/farmer/me/photo/upload-url (farmers/{your id}/photo-...);
        upload the image before saving the key.
      tags: [farmer-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: The updated farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/complete-profile:
    post:
      operationId: completeMyProfile
      summary: Complete a self sign-up
      description: >-
        For a farmer in pending_profile: sets name, language and village, makes the
        farmer active and assigns the lead FA covering the village (if any).
        409 profile_already_complete otherwise.
      tags: [farmer-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
      responses:
        '200':
          description: The now active farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/me/consents:
    get:
      operationId: listMyConsents
      summary: My current consents
      description: One entry per purpose; granted is null when the farmer was never asked.
      tags: [farmer-app]
      responses:
        '200':
          description: Current consent per purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: setMyConsent
      summary: Grant or withdraw a consent
      description: >-
        Appends a consent row (method app). Returns the current consents. Allowed while the
        farmer is still pending_profile, so sign-up can record the consent answer (FAR-04)
        before picking a village; deactivated farmers get 403.
      tags: [farmer-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConsentRequest'
      responses:
        '200':
          description: Current consent per purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/photo/upload-url:
    post:
      operationId: createMyPhotoUpload
      summary: Get a presigned upload URL for my photo
      description: >-
        Returns a presigned PUT for a new photo key under farmers/{your id}/. PUT the image with the
        returned headers, then save the key with PATCH /v1/farmer/me {photo_key}. jpeg, png or webp,
        at most 5 MB. Rate limited (20 an hour).
      tags: [farmer-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerPhotoUploadRequest'
      responses:
        '200':
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerPhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/farmer/me/plots:
    post:
      operationId: addMyPlot
      summary: Add a plot
      description: A pin and a typed area. The FA can walk the boundary later.
      tags: [farmer-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlotRequest'
      responses:
        '201':
          description: The new plot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/plots/{plot_id}/seasons:
    post:
      operationId: startMySeason
      summary: Start a crop season on a plot
      description: One active season per plot; 409 active_season_exists otherwise.
      tags: [farmer-app]
      parameters:
        - name: plot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSeasonRequest'
      responses:
        '201':
          description: The new season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/me/seasons/{season_id}/close:
    post:
      operationId: closeMySeason
      summary: Close an active season
      tags: [farmer-app]
      parameters:
        - name: season_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSeasonRequest'
      responses:
        '200':
          description: The closed season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/fas:
    get:
      operationId: listMyFAs
      summary: Look for FAs
      description: >-
        FAR-08/09. The FAs whose allocations cover the farmer's village, most specific
        level first and leads first; level narrows the list to village, mandal or district
        allocations. Each FA carries the phone number for the call button. Empty while the
        farmer has no village. Inactive FAs are left out.
      tags: [farmer-app]
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [village, mandal, district]
      responses:
        '200':
          description: FAs for the farmer's area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAOptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/fa/farmers/{farmer_id}/photo/upload-url:
    post:
      operationId: createFarmerPhotoUpload
      summary: Get a presigned upload URL for a farmer's photo
      description: >-
        For the photo taken at enrolment (EnrolFarmer.photo_key) or later (UpdateFarmer
        fields.photo_key). farmer_id is the ID the FA app minted, so the farmer need not exist
        on the server yet; if it does (or is a merged alias), it must be the FA's own farmer
        (403 otherwise). Returns a new key farmers/{farmer_id}/photo-{uuid}.{ext} and a presigned
        PUT; send the key in the command. jpeg, png or webp, at most 5 MB. Rate limited per FA
        (120 an hour).
      tags: [fa-farmers]
      parameters:
        - name: farmer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerPhotoUploadRequest'
      responses:
        '200':
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerPhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/farmers/lookup:
    get:
      operationId: lookupFarmerPhone
      summary: Is this phone number already registered?
      description: >-
        The FA app's check before an enrolment. status is new (not registered), mine (your
        farmer), unassigned_in_my_area (a farmer with no FA in your area: enrolling claims
        them), outside_my_area (no FA, but their village is not yours), other_fa (another
        FA's farmer: enrolment will be rejected registered_with_another_fa) or deactivated.
        farmer_id is given only for mine and unassigned_in_my_area. Rate limited per FA
        (60 an hour) and audited.
      tags: [fa-farmers]
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 20
      responses:
        '200':
          description: What the number is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/farmers/stats:
    get:
      operationId: getFarmerStats
      summary: Farmer numbers for the overview
      description: >-
        ADM-01. Counts within the caller's districts (HO users with an area scope), or one
        district. total excludes deactivated farmers; consent_pending counts farmers (not
        deactivated) with no programme consent recorded yet; new_last_7_days counts farmers
        registered in the last 7 days; unassigned counts active farmers with no FA.
      tags: [admin-farmers]
      parameters:
        - name: district_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/farmers:
    get:
      operationId: listFarmers
      summary: List farmers
      description: >-
        Newest first. Every filter is optional. q matches name (English or Telugu)
        or, when it has 4+ digits, the phone number. Phones are masked in the list.
      tags: [admin-farmers]
      parameters:
        - name: district_id
          in: query
          schema:
            type: string
            format: uuid
        - name: mandal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: village_id
          in: query
          schema:
            type: string
            format: uuid
        - name: fa_id
          in: query
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          description: Only farmers with no FA.
          schema:
            type: boolean
        - name: crop_id
          in: query
          description: Crop of an active season.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FarmerStatus'
        - name: plan
          in: query
          schema:
            $ref: '#/components/schemas/Plan'
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          description: Page size, default 50, maximum 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of farmers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFarmerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/farmers/{farmer_id}:
    parameters:
      - name: farmer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFarmer360
      summary: Farmer 360
      description: Profile, assigned FA, consents with history, plots with GeoJSON and seasons.
      tags: [admin-farmers]
      responses:
        '200':
          description: Everything about one farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer360'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFarmer
      summary: Edit a farmer
      description: >-
        Optimistic: expected_version must match (409 version_mismatch with
        details.current_version otherwise). Phone changes must not clash with
        another farmer (409 phone_taken). Changing plan is admin only (403
        otherwise) and needs a reason; it is audited as farmers.plan_changed.
      tags: [admin-farmers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateFarmerRequest'
      responses:
        '200':
          description: The updated farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/farmers/{farmer_id}/deactivate:
    post:
      operationId: deactivateFarmer
      summary: Deactivate a farmer
      description: The farmer drops out of FA snapshots and advisory targeting. History is kept.
      tags: [admin-farmers]
      parameters:
        - name: farmer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: The deactivated farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/farmers/{farmer_id}/reactivate:
    post:
      operationId: reactivateFarmer
      summary: Reactivate a farmer
      description: Back to active, or pending_profile if the profile was never completed.
      tags: [admin-farmers]
      parameters:
        - name: farmer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: The reactivated farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/farmer-reassignments:
    post:
      operationId: reassignFarmers
      summary: Reassign farmers to another FA
      description: >-
        Pick farmers by ID or by village (exactly one of farmer_ids / village_ids).
        By village, from_fa_id is required and only that FA's farmers in those villages
        move (a territory hand-over must not take other FAs' farmers sharing a village).
        With farmer_ids, from_fa_id is optional and, when given, only farmers currently
        with that FA move. Inactive farmers and farmers already with the FA are skipped.
        HO users with an area scope move only farmers in their districts, and only to an
        FA with an allocation in those districts (403 otherwise).
        Farmers are told their new FA by SMS (farmers.reassigned event).
      tags: [admin-farmers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
      responses:
        '200':
          description: What moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/season-rollovers:
    post:
      operationId: rolloverSeason
      summary: Close every active season of a season code
      description: >-
        Season-end helper: closes all active seasons with season_code (within the
        caller's districts) as harvested, or abandoned if asked.
      tags: [admin-farmers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloverRequest'
      responses:
        '200':
          description: How many seasons were closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (default and maximum depend on the endpoint).
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 200
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code (not_found, validation_failed, conflict, version_mismatch, ...).
          example: validation_failed
        message:
          type: string
          description: Human-readable English message.
        details:
          type: object
          additionalProperties: true
          description: 'Optional context, e.g. {"fields": {"phone": "invalid"}}.'
    Language:
      type: string
      enum: [te, en]
    FarmerStatus:
      type: string
      enum: [pending_profile, active, inactive]
    Plan:
      type: string
      enum: [free, premium]
    ConsentPurpose:
      type: string
      enum: [programme, soil_partner, schemes_finance, loyalty]
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Farmer:
      type: object
      required: [id, phone, name, name_te, language, village_id, mandal_id, district_id, assigned_fa_id,
        source, enrolled_by_fa_id, photo_key, plan, status, profile_completed_at, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: E.164, +91XXXXXXXXXX.
          example: '+919848012345'
        name:
          type: string
          nullable: true
        name_te:
          type: string
          nullable: true
        language:
          $ref: '#/components/schemas/Language'
        village_id:
          type: string
          format: uuid
          nullable: true
        mandal_id:
          type: string
          format: uuid
          nullable: true
        district_id:
          type: string
          format: uuid
          nullable: true
        assigned_fa_id:
          type: string
          format: uuid
          nullable: true
        source:
          type: string
          enum: [self, fa, ho]
        enrolled_by_fa_id:
          type: string
          format: uuid
          nullable: true
        photo_key:
          type: string
          nullable: true
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/FarmerStatus'
        profile_completed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FarmerVillage:
      type: object
      required: [id, name, name_te, mandal_id, mandal_name, mandal_name_te, district_id, district_name, district_name_te]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_te:
          type: string
          nullable: true
        mandal_id:
          type: string
          format: uuid
        mandal_name:
          type: string
        mandal_name_te:
          type: string
          nullable: true
        district_id:
          type: string
          format: uuid
        district_name:
          type: string
        district_name_te:
          type: string
          nullable: true
    FarmerFACard:
      type: object
      description: The FA as the farmer app and HO portal show them.
      required: [id, code, name, name_te, phone, level, languages, working_hours, photo_key, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: FA-KDP-014
        name:
          type: string
        name_te:
          type: string
          nullable: true
        phone:
          type: string
        level:
          type: string
          enum: [village, mandal, district]
        languages:
          type: array
          items:
            type: string
        working_hours:
          type: string
          nullable: true
        photo_key:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, leaving, inactive]
    FarmerFARef:
      type: object
      required: [id, code, name, name_te]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        name_te:
          type: string
          nullable: true
    Plot:
      type: object
      required: [id, farmer_id, label, village_id, boundary, pin, area_acres, area_source, gps_accuracy_m,
        status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        farmer_id:
          type: string
          format: uuid
        label:
          type: string
        village_id:
          type: string
          format: uuid
          nullable: true
        boundary:
          type: object
          nullable: true
          additionalProperties: true
          description: GeoJSON Polygon walked with GPS.
        pin:
          allOf:
            - $ref: '#/components/schemas/LatLng'
          nullable: true
        area_acres:
          type: number
          format: double
          description: Acres (40 guntas = 1 acre).
        area_source:
          type: string
          enum: [boundary, typed]
        gps_accuracy_m:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [active, archived]
        version:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Season:
      type: object
      required: [id, farmer_id, plot_id, season_code, crop_id, sowing_date, previous_crop_id, status, version,
        created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        farmer_id:
          type: string
          format: uuid
        plot_id:
          type: string
          format: uuid
        season_code:
          type: string
          example: rabi-2026-27
        crop_id:
          type: string
          format: uuid
        sowing_date:
          type: string
          format: date
          nullable: true
        previous_crop_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, harvested, abandoned]
        version:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Stage:
      type: object
      required: [id, code, name, name_te, seq, start_day, end_day]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: flowering
        name:
          type: string
        name_te:
          type: string
        seq:
          type: integer
          format: int32
        start_day:
          type: integer
          format: int32
        end_day:
          type: integer
          format: int32
    HomePlot:
      type: object
      required: [plot, active_season, days_after_sowing, current_stage]
      properties:
        plot:
          $ref: '#/components/schemas/Plot'
        active_season:
          allOf:
            - $ref: '#/components/schemas/Season'
          nullable: true
        days_after_sowing:
          type: integer
          nullable: true
          description: Days since the sowing date (sowing day = 0); null without one.
        current_stage:
          allOf:
            - $ref: '#/components/schemas/Stage'
          nullable: true
    PlannedVisit:
      type: object
      required: [visit_id, fa_id, plot_id, season_id, planned_for, planned_slot, purpose]
      properties:
        visit_id:
          type: string
          format: uuid
        fa_id:
          type: string
          format: uuid
        plot_id:
          type: string
          format: uuid
        season_id:
          type: string
          format: uuid
        planned_for:
          type: string
          format: date
        planned_slot:
          type: string
          enum: [morning, afternoon, any]
        purpose:
          type: string
          nullable: true
    FarmerHome:
      type: object
      required: [farmer, photo_url, village, plots, fa, next_visit]
      properties:
        farmer:
          $ref: '#/components/schemas/Farmer'
        photo_url:
          type: string
          nullable: true
          description: Presigned GET for the farmer's photo (valid 15 minutes); null without a photo.
        village:
          allOf:
            - $ref: '#/components/schemas/FarmerVillage'
          nullable: true
        plots:
          type: array
          items:
            $ref: '#/components/schemas/HomePlot'
        fa:
          allOf:
            - $ref: '#/components/schemas/FarmerFACard'
          nullable: true
        next_visit:
          allOf:
            - $ref: '#/components/schemas/PlannedVisit'
          nullable: true
    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          minLength: 1
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        photo_key:
          type: string
          minLength: 1
          maxLength: 200
          description: A storage_key from POST /v1/farmer/me/photo/upload-url.
    FarmerPhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [content_type, bytes]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          x-enum-varnames: [PhotoContentTypeJPEG, PhotoContentTypePNG, PhotoContentTypeWEBP]
        bytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 5242880
          description: Size of the file the phone will upload (at most 5 MB).
    FarmerPhotoUpload:
      type: object
      required: [storage_key, url, method, headers, expires_at]
      properties:
        storage_key:
          type: string
          description: The photo_key to send in EnrolFarmer / UpdateFarmer / PATCH /v1/farmer/me.
          example: farmers/0190a5b2-7c1e-7d4a-9b3f-2f1e4c5d6a7b/photo-0190a5b2-8d2f-7e5b-8c4a-3a2b1c0d9e8f.jpg
        url:
          type: string
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the phone must send with the upload.
        expires_at:
          type: string
          format: date-time
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required: [name, language, village_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          minLength: 1
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        village_id:
          type: string
          format: uuid
    Consent:
      type: object
      required: [id, purpose, granted, method, captured_by_fa_id, notice_version, language, audio_played, created_at]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        granted:
          type: boolean
        method:
          type: string
          enum: [app, fa_otp, ho]
        captured_by_fa_id:
          type: string
          format: uuid
          nullable: true
        notice_version:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        audio_played:
          type: boolean
        created_at:
          type: string
          format: date-time
    CurrentConsent:
      type: object
      required: [purpose, granted, method, notice_version, updated_at]
      properties:
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        granted:
          type: boolean
          nullable: true
          description: null = never asked.
        method:
          type: string
          enum: [app, fa_otp, ho]
          nullable: true
        notice_version:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    CurrentConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CurrentConsent'
    SetConsentRequest:
      type: object
      additionalProperties: false
      required: [purpose, granted, notice_version]
      properties:
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        granted:
          type: boolean
        notice_version:
          type: string
          minLength: 1
          maxLength: 40
        audio_played:
          type: boolean
    AddPlotRequest:
      type: object
      additionalProperties: false
      required: [pin, area_acres]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: Defaults to "Plot N".
        pin:
          $ref: '#/components/schemas/LatLng'
        area_acres:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
    StartSeasonRequest:
      type: object
      additionalProperties: false
      required: [season_code, crop_id]
      properties:
        season_code:
          type: string
          pattern: '^[a-z]+-[0-9]{4}(-[0-9]{2})?$'
          example: rabi-2026-27
        crop_id:
          type: string
          format: uuid
        sowing_date:
          type: string
          format: date
        previous_crop_id:
          type: string
          format: uuid
    CloseSeasonRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [harvested, abandoned]
    AdminFarmerListItem:
      type: object
      required: [id, name, name_te, phone_masked, language, source, plan, status, village, assigned_fa,
        active_crop_ids, total_area_acres, plot_count, programme_consent, consent_pending, consents_granted, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        name_te:
          type: string
          nullable: true
        phone_masked:
          type: string
          example: '+91******2345'
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          enum: [self, fa, ho]
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/FarmerStatus'
        village:
          allOf:
            - $ref: '#/components/schemas/FarmerVillage'
          nullable: true
        assigned_fa:
          allOf:
            - $ref: '#/components/schemas/FarmerFARef'
          nullable: true
        active_crop_ids:
          type: array
          items:
            type: string
            format: uuid
        total_area_acres:
          type: number
          format: double
        plot_count:
          type: integer
          format: int32
        programme_consent:
          type: boolean
          nullable: true
          description: Current programme consent; null = never asked.
        consent_pending:
          type: boolean
          description: >-
            No programme consent recorded yet (an FA enrolment without a verified consent
            OTP, or a self sign-up that has not answered).
        consents_granted:
          type: integer
          description: Purposes currently granted (of 4).
        created_at:
          type: string
          format: date-time
    FAOption:
      type: object
      required: [fa, coverage_level, is_lead, is_my_fa]
      properties:
        fa:
          $ref: '#/components/schemas/FarmerFACard'
        coverage_level:
          type: string
          enum: [village, mandal, district]
          description: The allocation level that covers the farmer's village.
        is_lead:
          type: boolean
        is_my_fa:
          type: boolean
          description: The farmer's assigned FA.
    FAOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FAOption'
    PhoneLookup:
      type: object
      required: [status, farmer_id]
      properties:
        status:
          type: string
          enum: [new, mine, unassigned_in_my_area, outside_my_area, other_fa, deactivated]
          x-enum-varnames: [LookupStatusNew, LookupStatusMine, LookupStatusUnassignedInMyArea,
            LookupStatusOutsideMyArea, LookupStatusOtherFA, LookupStatusDeactivated]
        farmer_id:
          type: string
          format: uuid
          nullable: true
          description: Only for mine and unassigned_in_my_area.
    FarmerStats:
      type: object
      required: [total, active, pending_profile, inactive, premium, consent_pending, new_last_7_days, unassigned]
      properties:
        total:
          type: integer
        active:
          type: integer
        pending_profile:
          type: integer
        inactive:
          type: integer
        premium:
          type: integer
        consent_pending:
          type: integer
        new_last_7_days:
          type: integer
        unassigned:
          type: integer
          description: Active farmers with no FA.
    AdminFarmerPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminFarmerListItem'
        next_cursor:
          type: string
          nullable: true
    Plot360:
      type: object
      required: [plot, seasons]
      properties:
        plot:
          $ref: '#/components/schemas/Plot'
        seasons:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/Season'
    Farmer360:
      type: object
      required: [farmer, photo_url, village, assigned_fa, enrolled_by_fa, consents, consent_pending, consent_history, plots]
      properties:
        farmer:
          $ref: '#/components/schemas/Farmer'
        photo_url:
          type: string
          nullable: true
          description: Presigned GET for the farmer's photo (valid 15 minutes); null without a photo.
        village:
          allOf:
            - $ref: '#/components/schemas/FarmerVillage'
          nullable: true
        assigned_fa:
          allOf:
            - $ref: '#/components/schemas/FarmerFACard'
          nullable: true
        enrolled_by_fa:
          allOf:
            - $ref: '#/components/schemas/FarmerFARef'
          nullable: true
        consents:
          type: array
          items:
            $ref: '#/components/schemas/CurrentConsent'
        consent_pending:
          type: boolean
          description: No programme consent recorded yet.
        consent_history:
          type: array
          description: Every consent row, newest first.
          items:
            $ref: '#/components/schemas/Consent'
        plots:
          type: array
          items:
            $ref: '#/components/schemas/Plot360'
    AdminUpdateFarmerRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          minLength: 1
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        village_id:
          type: string
          format: uuid
        phone:
          type: string
          minLength: 10
          maxLength: 20
        plan:
          $ref: '#/components/schemas/Plan'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required when plan changes (admin only; no payment until Phase 2).
    StatusChangeRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    ReassignRequest:
      type: object
      additionalProperties: false
      required: [to_fa_id]
      properties:
        to_fa_id:
          type: string
          format: uuid
        from_fa_id:
          type: string
          format: uuid
          description: >-
            Required with village_ids: only this FA's farmers move. Optional with farmer_ids
            (farmers not currently with this FA are skipped).
        farmer_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
        village_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    ReassignResult:
      type: object
      required: [moved, farmer_ids]
      properties:
        moved:
          type: integer
        farmer_ids:
          type: array
          items:
            type: string
            format: uuid
    RolloverRequest:
      type: object
      additionalProperties: false
      required: [season_code]
      properties:
        season_code:
          type: string
          pattern: '^[a-z]+-[0-9]{4}(-[0-9]{2})?$'
        outcome:
          type: string
          enum: [harvested, abandoned]
          default: harvested
    RolloverResult:
      type: object
      required: [closed]
      properties:
        closed:
          type: integer
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict (version mismatch, duplicate, wrong status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
