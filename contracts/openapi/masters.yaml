          minLength: 1
          maxLength: 80
        start_day:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        end_day:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
    StagesReplace:
      type: object
      required: [stages]
      properties:
        stages:
