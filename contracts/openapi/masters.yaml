      type: object
      required: [id, code, name_te, name, seq, start_day, end_day]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_te:
          type: string
        name:
          type: string
        seq:
          type: integer
          format: int32
        start_day:
          type: integer
          format: int32
        end_day:
          type: integer
          format: int32
    FarmerCrop:
      type: object
      required: [id, code, name_te, name, duration_days, stages]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_te:
          type: string
        name:
          type: string
        duration_days:
          type: integer
          format: int32
          nullable: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/FarmerStage'
    FarmerCropList:
      type: object
      required: [version, items, season_codes]
      properties:
        version:
          type: integer
          format: int64
          description: Masters version the list was built from.
        items:
          type: array
          items:
            $ref: '#/components/schemas/FarmerCrop'
        season_codes:
          $ref: '#/components/schemas/SeasonCodes'
    SeasonCodes:
      type: object
      description: >-
        Season codes to offer when a season is started, from today's IST date. Calendar:
        summer-YYYY 1 Apr-31 May, kharif-YYYY 1 Jun-31 Oct, rabi-YYYY-YY 1 Nov-31 Mar (YYYY is the
        November's year). all_open is previous, current and next, oldest first (a crop sown last
        season may still be standing). valid_until is the last day of current. The FA snapshot's
        masters section carries the same object as season_codes.
      required: [current, next, all_open, valid_until]
      properties:
        current:
          type: string
          example: kharif-2026
        next:
          type: string
          example: rabi-2026-27
        all_open:
          type: array
          items:
            type: string
          example: [summer-2026, kharif-2026, rabi-2026-27]
        valid_until:
          type: string
          format: date
          example: '2026-10-31'
    NearbyDealerView:
      type: object
      required: [id, name_te, name, phone, location, distance_m]
      properties:
        id:
          type: string
          format: uuid
        name_te:
          type: string
          nullable: true
        name:
          type: string
        phone:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/GeoPoint'
        distance_m:
          type: integer
          format: int32
          description: Straight-line distance in metres.
    NearbyDealerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NearbyDealerView'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict (version mismatch, duplicate, wrong status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
