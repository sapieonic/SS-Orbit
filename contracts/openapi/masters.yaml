                 salt_name_te, sku_id, sku_code, product_name, product_name_te, dose_per_acre, dose_per_acre_te,
                 status, change_note, created_by, created_at, submitted_by, submitted_at, approved_by, approved_at,
                 rejected_by, rejected_at, review_note]
      properties:
        id:
          type: string
          format: uuid
        rule_key:
          type: string
          format: uuid
          description: Stable identity across versions.
        version:
          type: integer
          format: int32
        issue_id:
          type: string
          format: uuid
        crop_id:
          type: string
          format: uuid
        issue_type:
          $ref: '#/components/schemas/IssueType'
        issue_name:
          type: string
        issue_name_te:
          type: string
        salt_id:
          type: string
          format: uuid
        salt_name:
          type: string
        salt_name_te:
          type: string
          nullable: true
        sku_id:
          type: string
          format: uuid
          nullable: true
        sku_code:
          type: string
          nullable: true
        product_name:
          type: string
          nullable: true
        product_name_te:
          type: string
          nullable: true
        dose_per_acre:
          type: string
        dose_per_acre_te:
          type: string
        status:
          $ref: '#/components/schemas/RuleStatus'
        change_note:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        submitted_by:
          type: string
          format: uuid
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        rejected_by:
          type: string
          format: uuid
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        review_note:
          type: string
          nullable: true
    RuleCreate:
