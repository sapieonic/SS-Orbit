        name_te:
          type: string
          minLength: 1
          maxLength: 80
        duration_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        stages:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/StageSpec'
    CropUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        name_te:
          type: string
          minLength: 1
          maxLength: 80
        duration_days:
          type: integer
          format: int32
