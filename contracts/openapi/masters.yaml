openapi: 3.0.3
info:
  title: Orbit Masters API
  version: 0.1.0
  description: >-
    Crops and stages, issues, salts, Shanmukha SKUs, versioned advisory rules
    (issue -> salt -> optional Shanmukha product) and dealers (ADM-08).
    HO reads: every HO role. HO writes: admin and agronomy (ops too for dealers).
    Advisory rules are maker-checker: anyone who can write drafts them, only
    agronomy approves, and never their own draft. Rows that other records point
    to are deactivated, never deleted. Every change the FA app can see bumps the
    masters version (part of the FA snapshot cache key).
tags:
  - name: masters
security:
  - bearerAuth: []
paths:
  /v1/admin/masters/version:
    get:
      operationId: getMastersVersion
      summary: Current masters version
      tags: [masters]
      responses:
        '200':
          description: The version counter bumped on every publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MastersVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/masters/crops:
    get:
      operationId: listCrops
      summary: List crops with their stages
      tags: [masters]
      parameters:
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of crops, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCrop
      summary: Add a crop, optionally with its stage calendar
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/crops/{crop_id}:
    parameters:
      - $ref: '#/components/parameters/CropID'
    get:
      operationId: getCrop
      summary: One crop with all its stages (inactive ones too)
      tags: [masters]
      responses:
        '200':
          description: The crop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCrop
      summary: Edit or (de)activate a crop
      description: Omitted fields are unchanged. The code is permanent.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropUpdate'
      responses:
        '200':
          description: The updated crop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/masters/crops/{crop_id}/stages:
    parameters:
      - $ref: '#/components/parameters/CropID'
    put:
      operationId: replaceCropStages
      summary: Replace the crop's stage calendar
      description: >-
        Stages are matched by code. Listed stages are created or updated and
        numbered in list order; stages left out are deactivated, never deleted,
        because seasons and visits point at them. Day ranges must be ascending
        and must not overlap.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StagesReplace'
      responses:
        '200':
          description: The crop with its new calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/masters/salts:
    get:
      operationId: listSalts
      summary: List salts (active ingredients)
      tags: [masters]
      parameters:
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of salts, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaltPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSalt
      summary: Add a salt
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaltCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaltView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/salts/{salt_id}:
    parameters:
      - $ref: '#/components/parameters/SaltID'
    patch:
      operationId: updateSalt
      summary: Edit or (de)activate a salt
      description: >-
        Omitted fields are unchanged. A salt used by a live rule cannot be
        deactivated (409 in_use); publish a new rule version first.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaltUpdate'
      responses:
        '200':
          description: The updated salt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaltView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/skus:
    get:
      operationId: listSkus
      summary: List Shanmukha SKUs
      tags: [masters]
      parameters:
        - name: salt_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of SKUs, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSku
      summary: Add a Shanmukha SKU
      description: Shanmukha products only; competitor brands are never stored (FA-09).
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/skus/{sku_id}:
    parameters:
      - $ref: '#/components/parameters/SkuID'
    patch:
      operationId: updateSku
      summary: Edit or (de)activate a SKU
      description: >-
        Omitted fields are unchanged; the code is permanent. A SKU named by a
        live rule cannot be deactivated or moved to another salt (409 in_use).
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuUpdate'
      responses:
        '200':
          description: The updated SKU.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/issues:
    get:
      operationId: listIssues
      summary: List pests, diseases and deficiencies
      tags: [masters]
      parameters:
        - name: crop_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/IssueType'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of issues, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createIssue
      summary: Add an issue to a crop
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/issues/{issue_id}:
    parameters:
      - $ref: '#/components/parameters/IssueID'
    patch:
      operationId: updateIssue
      summary: Edit or (de)activate an issue
      description: Omitted fields are unchanged. The crop is permanent.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: The updated issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/dealers:
    get:
      operationId: listDealers
      summary: List dealers
      tags: [masters]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DealerStatus'
        - name: village_id
          in: query
          schema:
            type: string
            format: uuid
        - name: sku_id
          in: query
          description: Only dealers stocking this SKU.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of dealers, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDealer
      summary: Add a dealer
      description: Starts as to_verify unless a status is given. Only active dealers with a pinned location reach farmers.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealerCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/masters/dealers/{dealer_id}:
    parameters:
      - $ref: '#/components/parameters/DealerID'
    get:
      operationId: getDealer
      summary: One dealer
      tags: [masters]
      responses:
        '200':
          description: The dealer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDealer
      summary: Edit, verify or deactivate a dealer
      description: >-
        Omitted fields are unchanged; sku_ids, when sent, replaces the stocked
        list. A dealer needs a pinned location to become active.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealerUpdate'
      responses:
        '200':
          description: The updated dealer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/masters/rules:
    get:
      operationId: listRules
      summary: List advisory rule versions
      description: Every version is kept. Filter by rule_key for one rule's history.
      tags: [masters]
      parameters:
        - name: rule_key
          in: query
          schema:
            type: string
            format: uuid
        - name: issue_id
          in: query
          schema:
            type: string
            format: uuid
        - name: crop_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RuleStatus'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of rule versions, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRuleDraft
      summary: Draft a new rule, or a new version of an existing rule
      description: >-
        Without rule_key a new rule is started (one rule per issue and salt: 409
        rule_exists names the existing key). With rule_key the draft becomes the
        next version of that rule (one open draft per rule: 409 draft_exists).
        The SKU, if given, must contain the chosen salt.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/rules/{rule_id}:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    get:
      operationId: getRule
      summary: One rule version
      tags: [masters]
      responses:
        '200':
          description: The rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRuleDraft
      summary: Rewrite a draft that has not been submitted yet
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleDraftUpdate'
      responses:
        '200':
          description: The updated draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/rules/{rule_id}/submit:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: submitRule
      summary: Send a draft to Agronomy for approval
      description: A submitted draft can no longer be edited; Agronomy approves or rejects it.
      tags: [masters]
      responses:
        '200':
          description: The submitted draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/rules/{rule_id}/approve:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: approveRule
      summary: Approve a submitted draft and make it live
      description: >-
        Agronomy only, and never the draft's author. The previous live version
        of the rule is superseded in the same transaction and the masters
        version is bumped, so the change reaches the apps at their next sync.
      tags: [masters]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleReview'
      responses:
        '200':
          description: The live rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/masters/rules/{rule_id}/reject:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: rejectRule
      summary: Reject a draft
      description: Agronomy only. The note tells the author what to change.
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRejection'
      responses:
        '200':
          description: The rejected draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/farmer/crops:
    get:
      operationId: listFarmerCrops
      summary: Active crops with their stage calendars (Telugu first)
      description: Also returns today's season codes (season_codes) for the season picker.
      tags: [masters]
      responses:
        '200':
          description: Every active crop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerCropList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/farmer/dealers:
    get:
      operationId: listNearbyDealers
      summary: Active dealers near a point, nearest first
      tags: [masters]
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius_km
          in: query
          description: Search radius, default 25 km.
          schema:
            type: number
            format: double
            minimum: 0.1
            maximum: 100
        - name: sku_id
          in: query
          description: Only dealers stocking this SKU.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum dealers returned, default 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Nearby dealers, nearest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyDealerList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (default and maximum depend on the endpoint).
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 200
    Limit200:
      name: limit
      in: query
      description: Page size, default 50, maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    ActiveFilter:
      name: active
      in: query
      description: Only active (true) or only inactive (false) rows; omit for both.
      schema:
        type: boolean
    Search:
      name: q
      in: query
      description: Case-insensitive name (or code) substring.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CropID:
      name: crop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaltID:
      name: salt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuID:
      name: sku_id
      in: path
      required: true
      schema:
