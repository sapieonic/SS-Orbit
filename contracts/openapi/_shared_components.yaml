# Shared components: copy this block VERBATIM into the `components:` section
# of every module spec (oapi-codegen generates one Go package per spec, so
# cross-file $refs are not used). The error shape and pagination parameters
# must be identical in every module (CONVENTIONS section 4).
#
# This file is documentation only; it is not compiled.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (default and maximum depend on the endpoint).
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 200
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code (not_found, validation_failed, conflict, version_mismatch, ...).
          example: validation_failed
        message:
          type: string
          description: Human-readable English message.
        details:
          type: object
          additionalProperties: true
          description: 'Optional context, e.g. {"fields": {"phone": "invalid"}}.'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict (version mismatch, duplicate, wrong status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
