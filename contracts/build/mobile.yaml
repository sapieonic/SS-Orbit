    EnrolFarmerConsent:
      type: object
      description: 'The consent the farmer gave on the FA''s phone (FAR-04). With an otp_proof, purposes must include programme
        and notice_version is required. Documentation of a sync command payload (x-orbit-doc-only): the owning module validates
        the JSON; the server does not check it against this schema.'
      x-orbit-doc-only: true
      properties:
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/SyncConsentPurpose'
        otp_proof:
          type: string
          nullable: true
          description: The proof from POST /v1/fa/consent-otp/verify (null or empty = consent pending).
        audio_played:
          type: boolean
          description: The consent notice audio was played to the farmer.
        notice_version:
          type: string
    EnrolFarmerPayload:
      type: object
      description: 'EnrolFarmer (farmers module): enrol a farmer on the FA''s phone. farmer_id is generated on the phone;
        if the phone number already belongs to a farmer the result is merged (merged_into is the farmer to use). Without a
        valid consent.otp_proof the farmer is enrolled consent pending. Documentation of a sync command payload (x-orbit-doc-only):
        the owning module validates the JSON; the server does not check it against this schema.'
      x-orbit-doc-only: true
      required:
      - farmer_id
      - phone
      - name
      - language
      - village_id
      - consent
      properties:
        farmer_id:
          type: string
          format: uuid
        phone:
          type: string
          description: 10-digit Indian mobile number (+91 optional).
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          nullable: true
        language:
          type: string
          enum:
          - te
          - en
        village_id:
          type: string
          format: uuid
        photo_key:
          type: string
          nullable: true
          description: Key from POST /v1/fa/farmers/{farmer_id}/photo/upload-url for this farmer_id; any other key is dropped
            (the enrolment is kept).
        consent:
          $ref: '#/components/schemas/EnrolFarmerConsent'
