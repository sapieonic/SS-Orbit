openapi: 3.0.3
info:
  title: Orbit mobile API (farmer app, FA app)
  version: 0.1.0
  description: Generated by tools/bundle-specs.py from contracts/openapi/{farmers,geo,identity,masters,messaging,sync,visits}.yaml.
    Do not edit; edit the module specs and re-run it.
tags:
- name: alerts
- name: auth
  description: Sign-in, refresh and sign-out (no token needed).
- name: consent
  description: Consent OTP for FA-assisted enrolment (FA app, online).
- name: devices
  description: App device heartbeat and HO device management.
- name: fa
- name: fa-farmers
- name: farmer
- name: farmer-app
- name: geo
- name: inbox
- name: masters
- name: sync
security:
- bearerAuth: []
paths:
  /v1/auth/app-config:
    get:
      operationId: getAppConfig
      summary: App release settings (forced update, feature flags)
      description: Read by the farmer and FA apps at start, before sign-in. An app whose version is below min_version must
        stop and send the user to store_url. latest_version is never below min_version; an app below it may offer the update.
        flags are feature switches (unknown flags must be ignored). The values come from server config and change rarely,
        so the response is cacheable for 5 minutes. The device heartbeats also return min_version.
      tags:
      - auth
      security: []
      parameters:
      - name: app
        in: query
        required: true
        schema:
          type: string
          enum:
          - farmer
          - fa
      responses:
        '200':
          description: Release settings.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/fa/login:
    post:
      operationId: faLogin
      summary: FA sign-in with login ID and password
      description: Registers or refreshes the device. Any failure (unknown ID, wrong password, inactive login) is 401 `unauthorized`
        with the same message; a revoked device is 401 `device_revoked`; a correct temporary password older than 72 hours
        is 401 `temp_password_expired`. When must_change_password is true the token only works for POST /v1/fa/me/password
        (403 `password_change_required` elsewhere).
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FALogin'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FASession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/login:
    post:
      operationId: hoLogin
      summary: HO sign-in with email, password and TOTP
      description: 'Two-step sign-in is required for every HO user. Wrong email/password/code is 401 `unauthorized` (one message
        for all). If the user has not set up TOTP yet the response is 401 `totp_enrolment_required` (only after a correct
        password): call /v1/auth/ho/totp/start then /confirm. A correct temporary password older than 72 hours is 401 `temp_password_expired`.'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HOLogin'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HOSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/totp/confirm:
    post:
      operationId: confirmTotpEnrolment
      summary: Confirm TOTP set-up with a code and sign in
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
      responses:
        '200':
          description: TOTP enabled and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HOSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/totp/start:
    post:
      operationId: startTotpEnrolment
      summary: Start TOTP set-up (first sign-in, or after an admin reset)
      description: Checks email + password and returns a new secret as an otpauth:// URL for the authenticator app. Calling
        it again replaces the pending secret. Refused (409 `totp_already_enabled`) once TOTP is set up; an admin must reset
        it first.
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpStart'
      responses:
        '200':
          description: Pending secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out (revoke the session)
      description: Revokes the session of the bearer access token, or of the refresh token in the body. Always 204, also when
        the session is unknown or already revoked.
      tags:
      - auth
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Send a sign-in OTP to a farmer's phone
      description: Sends a 6-digit code by SMS (Telugu by default). A new request replaces the previous code. Limited per
        phone (one every 30 s, a few per hour) and per IP. The response never says whether the phone is already registered.
        When the server has the farmer app's signature hash configured, the SMS is in the Android SMS Retriever format ("<#>"
        first, the 11-character hash on the last line), so the app can read the code without a tap; otherwise use the SMS
        User Consent API.
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify the OTP and sign the farmer in
      description: 'On success the farmer record is found or created (self sign-up), the device is registered and a session
        is created. Errors: 400 `otp_invalid` (wrong code, details.attempts_left) or `otp_expired` (no live code, expired,
        used, or too many wrong tries: request a new one); 401 `device_revoked` (wipe and use a new install ID).'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Swap a refresh token for a new token pair
      description: 'Refresh tokens rotate: each is accepted once. A retry with the token just rotated (lost response on a
        slow network, or two parallel refreshes) within 60 seconds, while its successor is still unused, returns that same
        successor refresh token with a fresh access token. Any other reuse of a rotated token revokes the whole session family
        (401 `refresh_reused`). Also 401 when the session expired or was revoked, the device was revoked (`device_revoked`),
        the login was deactivated, or the temporary password expired (`temp_password_expired`). The new access token reflects
        the account as it is now (role, area, must-change flag).'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/alerts:
    get:
      operationId: listFAAlerts
      summary: The FA's alerts, newest first
      description: The same alerts are in the offline snapshot (section alerts); acknowledge with the AckAlert sync command.
      tags:
      - alerts
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - acknowledged
          - closed
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAAlertPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fa/consent-otp/request:
    post:
      operationId: requestConsentOtp
      summary: Send the consent SMS to a farmer being enrolled
      description: 'Sends the farmer an SMS (Telugu by default) explaining that they agree to join the programme and share
        their data with Shanmukha Agritec, with a 6-digit code. The farmer reads the code out to the FA only if they agree.
        A new request replaces the previous code for that phone. Limited per phone (one every 30 s, a few per hour) and per
        FA. Needs network: the app falls back to enrolment without OTP consent (RecordConsent later) when offline.'
      tags:
      - consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/consent-otp/verify:
    post:
      operationId: verifyConsentOtp
      summary: Check the consent code and get a consent proof
      description: 'Checks the code the farmer read out. Only the FA who asked for the code can use it, once. Returns otp_proof,
        a signed token bound to this FA and phone, valid for 7 days: put it in EnrolFarmer.consent.otp_proof or RecordConsent.otp_proof.
        Errors as for sign-in codes: 400 `otp_invalid` (details.attempts_left) or `otp_expired`.'
      tags:
      - consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentOtpVerify'
      responses:
        '200':
          description: Consent verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentProof'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/devices/me:
    put:
      operationId: faDeviceHeartbeat
      summary: FA app heartbeat and push-token update
      description: Updates last seen, app details and the push token. wipe=true tells the app to delete local data and sign
        out (device revoked or login deactivated). Revoked FA devices are normally stopped earlier by the API with 401 `device_revoked`.
      tags:
      - devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Device status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/fa/farmers/lookup:
    get:
      operationId: lookupFarmerPhone
      summary: Is this phone number already registered?
      description: 'The FA app''s check before an enrolment. status is new (not registered), mine (your farmer), unassigned_in_my_area
        (a farmer with no FA in your area: enrolling claims them), outside_my_area (no FA, but their village is not yours),
        other_fa (another FA''s farmer: enrolment will be rejected registered_with_another_fa) or deactivated. farmer_id is
        given only for mine and unassigned_in_my_area. Rate limited per FA (60 an hour) and audited.'
      tags:
      - fa-farmers
      parameters:
      - name: phone
        in: query
        required: true
        schema:
          type: string
          minLength: 10
          maxLength: 20
      responses:
        '200':
          description: What the number is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/farmers/{farmer_id}/photo/upload-url:
    post:
      operationId: createFarmerPhotoUpload
      summary: Get a presigned upload URL for a farmer's photo
      description: For the photo taken at enrolment (EnrolFarmer.photo_key) or later (UpdateFarmer fields.photo_key). farmer_id
        is the ID the FA app minted, so the farmer need not exist on the server yet; if it does (or is a merged alias), it
        must be the FA's own farmer (403 otherwise). Returns a new key farmers/{farmer_id}/photo-{uuid}.{ext} and a presigned
        PUT; send the key in the command. jpeg, png or webp, at most 5 MB. Rate limited per FA (120 an hour).
      tags:
      - fa-farmers
      parameters:
      - name: farmer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerPhotoUploadRequest'
      responses:
        '200':
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerPhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/me/password:
    post:
      operationId: changeFAPassword
      summary: FA changes their own password
      description: Required after a temporary password (401 `temp_password_expired` once it is over 72 hours old). Signs out
        the FA's other sessions. The current access token keeps its must-change flag; call /v1/auth/refresh to get one without
        it.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/fa/sync/commands:
    post:
      operationId: submitSyncCommands
      summary: Push a batch of offline commands
      description: 'Commands are processed in order. Each command ID is an idempotency key: a command already stored for this
        FA returns its stored result and is not applied again. If the server hits an infrastructure error, it stops and returns
        the results so far with retry_from set to the index of the first unprocessed command; the app resends from there later.
        A command the server fails to apply 5 times is stored as rejected with error "server_could_not_apply" so the queue
        moves on. A payload the database cannot store (bad text, out-of-range value, constraint violation) is rejected at
        once. The response carries the FA''s current territory and masters versions; if they differ from the app''s snapshot,
        the app pulls a new snapshot.'
      tags:
      - sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandBatch'
      responses:
        '200':
          description: Results for the processed commands, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fa/sync/snapshot:
    get:
      operationId: getSyncSnapshot
      summary: Download the FA's offline snapshot
      description: Everything the FA app keeps offline, as one JSON document, gzip-encoded (Content-Encoding gzip) unless
        the client does not accept gzip. The ETag is "t{territory_version}-m{masters_version}"; send it back in If-None-Match
        to get 304 when nothing changed.
      tags:
      - sync
      parameters:
      - name: If-None-Match
        in: header
        schema:
          type: string
          maxLength: 500
      - name: Accept-Encoding
        in: header
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: The snapshot.
          headers:
            ETag:
              schema:
                type: string
            Content-Encoding:
              description: gzip, when the client accepts it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '304':
          description: The app's snapshot is current.
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fa/sync/status:
    get:
      operationId: getSyncStatus
      summary: Current snapshot versions (cheap poll)
      description: The FA's current territory and masters versions and the matching snapshot ETag. The app polls this and
        pulls a snapshot only when the ETag differs from the one it holds.
      tags:
      - sync
      responses:
        '200':
          description: Current versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fa/visits/{visit_id}/photos/{photo_id}/confirm:
    post:
      operationId: confirmVisitPhotoUpload
      summary: Confirm a visit photo was uploaded
      description: Checks the object exists in storage and marks the photo uploaded. Idempotent. 409 upload_missing if the
        object is not there yet.
      tags:
      - fa
      parameters:
      - $ref: '#/components/parameters/VisitID'
      - $ref: '#/components/parameters/PhotoID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoConfirmRequest'
      responses:
        '200':
          description: The photo, now uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/fa/visits/{visit_id}/photos/{photo_id}/upload-url:
    post:
      operationId: createVisitPhotoUpload
      summary: Get a presigned upload URL for a visit photo
      description: The photo row is created by the LogVisit command, so sync the command first. The phone then PUTs the image
        to the returned URL with the returned headers and calls confirm. Only the FA who logged the visit may upload. content_type
        must match the one sent in LogVisit.
      tags:
      - fa
      parameters:
      - $ref: '#/components/parameters/VisitID'
      - $ref: '#/components/parameters/PhotoID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
      responses:
        '200':
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/callbacks:
    post:
      operationId: requestCallback
      summary: Ask your FA to call you back
      description: 'One open request at a time: if one is already open it is returned with 200 (safe to retry from the offline
        outbox). 409 no_fa_assigned when the farmer has no FA yet.'
      tags:
      - farmer
      responses:
        '200':
          description: A request was already open; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
        '201':
          description: Request created; the FA is alerted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/callbacks/current:
    get:
      operationId: getMyOpenCallback
      summary: The farmer's open call-back request, if any
      tags:
      - farmer
      responses:
        '200':
          description: The open request, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCallbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/callbacks/{callback_id}/cancel:
    post:
      operationId: cancelMyCallback
      summary: Withdraw my call-back request
      description: Idempotent. 409 callback_closed if the FA already closed it.
      tags:
      - farmer
      parameters:
      - name: callback_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The cancelled request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/crops:
    get:
      operationId: listFarmerCrops
      summary: Active crops with their stage calendars (Telugu first)
      description: Also returns today's season codes (season_codes) for the season picker.
      tags:
      - masters
      responses:
        '200':
          description: Every active crop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerCropList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/dealers:
    get:
      operationId: listNearbyDealers
      summary: Active dealers near a point, nearest first
      tags:
      - masters
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: radius_km
        in: query
        description: Search radius, default 25 km.
        schema:
          type: number
          format: double
          minimum: 0.1
          maximum: 100
      - name: sku_id
        in: query
        description: Only dealers stocking this SKU.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum dealers returned, default 20.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Nearby dealers, nearest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyDealerList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/devices/me:
    put:
      operationId: farmerDeviceHeartbeat
      summary: Farmer app heartbeat and push-token update
      description: Same as the FA heartbeat. wipe=true when the device was revoked.
      tags:
      - devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Device status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/farmer/fas:
    get:
      operationId: listMyFAs
      summary: Look for FAs
      description: FAR-08/09. The FAs whose allocations cover the farmer's village, most specific level first and leads first;
        level narrows the list to village, mandal or district allocations. Each FA carries the phone number for the call button.
        Empty while the farmer has no village. Inactive FAs are left out.
      tags:
      - farmer-app
      parameters:
      - name: level
        in: query
        schema:
          type: string
          enum:
          - village
          - mandal
          - district
      responses:
        '200':
          description: FAs for the farmer's area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAOptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/farmer/geo/tree:
    get:
      operationId: getFarmerGeoTree
      summary: District and mandal tree for the village picker
      description: Lets the app browse district, then mandal, then /v1/farmer/villages?mandal_id=.
      tags:
      - geo
      responses:
        '200':
          description: The tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me:
    get:
      operationId: getMyHome
      summary: Farmer home
      description: The signed-in farmer's profile, plots with their active season and current crop stage, the assigned FA
        card and the next planned FA visit.
      tags:
      - farmer-app
      responses:
        '200':
          description: Home data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerHome'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMyProfile
      summary: Update my profile
      description: Name, language and photo. The village is changed through the FA or HO. photo_key must be a key returned
        by POST /v1/farmer/me/photo/upload-url (farmers/{your id}/photo-...); upload the image before saving the key.
      tags:
      - farmer-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: The updated farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/complete-profile:
    post:
      operationId: completeMyProfile
      summary: Complete a self sign-up
      description: 'For a farmer in pending_profile: sets name, language and village, makes the farmer active and assigns
        the lead FA covering the village (if any). 409 profile_already_complete otherwise.'
      tags:
      - farmer-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
      responses:
        '200':
          description: The now active farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/me/consents:
    get:
      operationId: listMyConsents
      summary: My current consents
      description: One entry per purpose; granted is null when the farmer was never asked.
      tags:
      - farmer-app
      responses:
        '200':
          description: Current consent per purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: setMyConsent
      summary: Grant or withdraw a consent
      description: Appends a consent row (method app). Returns the current consents. Allowed while the farmer is still pending_profile,
        so sign-up can record the consent answer (FAR-04) before picking a village; deactivated farmers get 403.
      tags:
      - farmer-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConsentRequest'
      responses:
        '200':
          description: Current consent per purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/photo/upload-url:
    post:
      operationId: createMyPhotoUpload
      summary: Get a presigned upload URL for my photo
      description: Returns a presigned PUT for a new photo key under farmers/{your id}/. PUT the image with the returned headers,
        then save the key with PATCH /v1/farmer/me {photo_key}. jpeg, png or webp, at most 5 MB. Rate limited (20 an hour).
      tags:
      - farmer-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerPhotoUploadRequest'
      responses:
        '200':
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerPhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/farmer/me/plots:
    post:
      operationId: addMyPlot
      summary: Add a plot
      description: A pin and a typed area. The FA can walk the boundary later.
      tags:
      - farmer-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlotRequest'
      responses:
        '201':
          description: The new plot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/me/plots/{plot_id}/seasons:
    post:
      operationId: startMySeason
      summary: Start a crop season on a plot
      description: One active season per plot; 409 active_season_exists otherwise.
      tags:
      - farmer-app
      parameters:
      - name: plot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSeasonRequest'
      responses:
        '201':
          description: The new season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/me/seasons/{season_id}/close:
    post:
      operationId: closeMySeason
      summary: Close an active season
      tags:
      - farmer-app
      parameters:
      - name: season_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSeasonRequest'
      responses:
        '200':
          description: The closed season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/farmer/notices:
    get:
      operationId: listFarmerNotices
      summary: My Crop Advisory inbox, newest first
      tags:
      - inbox
      parameters:
      - name: limit
        in: query
        description: Page size, default 30, maximum 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of notices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/notices/unread-count:
    get:
      operationId: getUnreadNoticeCount
      summary: Number of unread notices (badge)
      tags:
      - inbox
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/notices/{notice_id}/listened:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    post:
      operationId: markNoticeListened
      summary: Record that the farmer played the voice note (idempotent; also marks read)
      tags:
      - inbox
      responses:
        '204':
          description: Marked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/farmer/notices/{notice_id}/read:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    post:
      operationId: markNoticeRead
      summary: Mark a notice read (idempotent)
      tags:
      - inbox
      responses:
        '204':
          description: Marked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/farmer/villages:
    get:
      operationId: searchFarmerVillages
      summary: Pick your village (farmer self sign-up)
      description: Search by name or Telugu name (prefix matches first, then trigram similarity). Without q, villages matching
        the filters sorted by name. Returns at most limit items; no pagination.
      tags:
      - geo
      parameters:
      - $ref: '#/components/parameters/VillageQuery'
      - name: mandal_id
        in: query
        schema:
          type: string
          format: uuid
      - name: district_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Default 20, maximum 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Matching villages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/visits:
    get:
      operationId: listMyVisits
      summary: My visits (farmer app F4)
      description: The farmer's logged visits, newest first, with the advice given in Telugu and English.
      tags:
      - farmer
      parameters:
      - name: limit
        in: query
        description: Page size, default 20, maximum 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of visits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerVisitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/farmer/visits/next:
    get:
      operationId: getMyNextVisit
      summary: Next planned FA visit
      tags:
      - farmer
      responses:
        '200':
          description: The next planned visit, or null when none is planned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextVisitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/web/notices/{notice_id}:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    get:
      operationId: getWebNotice
      summary: A notice for the farmer web page opened from an SMS or WhatsApp link
      description: Needs the signed link token (kind web, purpose "notice:<notice_id>") as ?t= or bearer. audio_url is a short-lived
        presigned URL for the voice note.
      tags:
      - inbox
      parameters:
      - name: t
        in: query
        description: Signed link token (alternative to the Authorization header).
        schema:
          type: string
          maxLength: 2048
      responses:
        '200':
          description: The notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/web/notices/{notice_id}/listened:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    post:
      operationId: markWebNoticeListened
      summary: Record a play of the voice note on the web page (idempotent)
      tags:
      - inbox
      parameters:
      - name: t
        in: query
        description: Signed link token (alternative to the Authorization header).
        schema:
          type: string
          maxLength: 2048
      responses:
        '204':
          description: Marked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    AckAlertPayload:
      type: object
      description: 'AckAlert (messaging module) acknowledges one of the FA''s alerts; idempotent. Documentation of a sync
        command payload (x-orbit-doc-only): the owning module validates the JSON; the server does not check it against this
        schema.'
      x-orbit-doc-only: true
      required:
      - alert_id
      properties:
        alert_id:
          type: string
          format: uuid
    AddPlotRequest:
      type: object
      additionalProperties: false
      required:
      - pin
      - area_acres
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: Defaults to "Plot N".
        pin:
          $ref: '#/components/schemas/LatLng'
        area_acres:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
    AppConfig:
      type: object
      required:
      - app
      - min_version
      - latest_version
      - store_url
      - flags
      properties:
        app:
          type: string
          enum:
          - farmer
          - fa
        min_version:
          type: string
          description: Versions below this must update before use ("0.0.0" forces nothing).
          example: 1.4.0
        latest_version:
          type: string
          description: Newest released version (never below min_version).
          example: 1.6.2
        store_url:
          type: string
          nullable: true
          description: Where to update (Play Store link); null when not configured.
        flags:
          type: object
          additionalProperties:
            type: boolean
          description: Feature switches by name. Unknown names must be ignored.
    Callback:
      type: object
      required:
      - id
      - farmer_id
      - fa_id
      - status
      - requested_at
      - closed_at
      properties:
        id:
          type: string
          format: uuid
        farmer_id:
          type: string
          format: uuid
        fa_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - open
          - closed
          - cancelled
        requested_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
    CancelVisitPayload:
      type: object
      description: 'CancelVisit (visits module) cancels a planned visit of the FA. Documentation of a sync command payload
        (x-orbit-doc-only): the owning module validates the JSON; the server does not check it against this schema.'
      x-orbit-doc-only: true
      required:
      - visit_id
      properties:
        visit_id:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
    CloseCallbackPayload:
      type: object
      description: 'CloseCallback (visits module) closes a call-back request assigned to the FA. Documentation of a sync command
        payload (x-orbit-doc-only): the owning module validates the JSON; the server does not check it against this schema.'
      x-orbit-doc-only: true
      required:
      - callback_id
      properties:
        callback_id:
          type: string
          format: uuid
        note:
          type: string
          nullable: true
    CloseSeasonRequest:
      type: object
      additionalProperties: false
      required:
      - outcome
      properties:
        outcome:
          type: string
          enum:
          - harvested
          - abandoned
    CommandBatch:
      type: object
      required:
      - commands
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/CommandIn'
    CommandBatchResult:
      type: object
      required:
      - results
      - retry_from
      - territory_version
      - masters_version
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CommandResult'
        retry_from:
          type: integer
          nullable: true
          description: Index of the first command not processed because of a server-side failure; resend commands from this
            index later. Null when every command was processed.
        territory_version:
          type: integer
          format: int64
        masters_version:
          type: integer
          format: int64
    CommandIn:
      type: object
      required:
      - id
      - type
      - payload
      properties:
        id:
          type: string
          format: uuid
          description: Generated on the phone; the idempotency key.
        type:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
          example: LogVisit
          description: Command type (CONVENTIONS section 6). Unknown types are rejected.
        payload:
          type: object
          additionalProperties: true
          description: 'Command-specific payload, snake_case JSON. The shape per type is documented by the <Type>Payload schemas
            (see SyncCommandPayloads): EnrolFarmer, RecordConsent, SavePlot, StartSeason, UpdateFarmer, PlanVisit, LogVisit,
            CancelVisit, CloseCallback, AckAlert. The owning module validates it; this spec does not.'
          x-go-type: json.RawMessage
        client_created_at:
          type: string
          format: date-time
          nullable: true
          description: When the FA did this on the phone.
    CommandResult:
      type: object
      description: Outcome of one command, as stored.
      required:
      - id
      - status
      - entity_id
      - merged_into
      - conflict
      - error
      properties:
        id:
          type: string
          format: uuid
          description: The command ID.
        status:
          $ref: '#/components/schemas/CommandStatus'
        entity_id:
          type: string
          format: uuid
          nullable: true
          description: The entity the command created or changed (null when rejected before it was known).
        merged_into:
          type: string
          format: uuid
          nullable: true
          description: For merged, the existing entity the app should use instead (e.g. the farmer with that phone).
        conflict:
          allOf:
          - $ref: '#/components/schemas/Conflict'
          nullable: true
        error:
          type: string
          nullable: true
          description: For rejected, why (English; the app shows it and drops the command).
    CommandStatus:
      type: string
      enum:
      - applied
      - merged
      - conflict
      - rejected
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - language
      - village_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          minLength: 1
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        village_id:
          type: string
          format: uuid
    Conflict:
      type: object
      required:
      - field
      - yours
      - theirs
      properties:
        field:
          type: string
        yours:
          description: The value the FA sent.
        theirs:
          description: The value on the server.
    ConsentOtpVerify:
      type: object
      required:
      - phone
      - code
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 20
        code:
          type: string
          pattern: ^[0-9]{6}$
    ConsentProof:
      type: object
      required:
      - phone
      - otp_proof
      - verified_at
      - expires_at
      properties:
        phone:
          type: string
          description: The farmer's phone, normalised (+91XXXXXXXXXX). The proof is bound to it.
          example: '+919848012345'
        otp_proof:
          type: string
          description: Signed proof for EnrolFarmer.consent.otp_proof / RecordConsent.otp_proof.
        verified_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: The proof is rejected after this (7 days).
    ConsentPurpose:
      type: string
      enum:
      - programme
      - soil_partner
