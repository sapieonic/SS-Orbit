    post:
      operationId: importVillages
      summary: Bulk import villages from CSV
      description: 'CSV with a header row. Columns (any order, case-insensitive): district, mandal, village (required), name_te,
        lgd_code, lat, lng (optional). Districts and mandals are matched by name, ignoring case. Idempotent on (mandal, village
        name): an existing village is updated with the non-empty values in its row. All or nothing: if any row is invalid
        nothing is written and the response is 400 validation_failed with details.fields keyed "row N" (N = line number in
        the file). Admin or ops; area-scoped users may only import into their districts.'
      tags:
      - geo
      parameters:
      - name: create_missing
        in: query
        description: Create districts and mandals named in the file that do not exist yet (default false).
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: 'district,mandal,village,name_te,lgd_code,lat,lng

              Rangareddy,Serilingampally,Kondapur,కొండాపూర్,574123,17.4699,78.3578

              '
