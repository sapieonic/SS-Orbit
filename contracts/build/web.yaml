          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/season-rollovers:
    post:
      operationId: rolloverSeason
      summary: Close every active season of a season code
      description: 'Season-end helper: closes all active seasons with season_code (within the caller''s districts) as harvested,
        or abandoned if asked.'
      tags:
      - admin-farmers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloverRequest'
      responses:
        '200':
          description: How many seasons were closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/sync/commands:
    get:
      operationId: listSyncCommands
      summary: Review stored sync commands
      description: Newest first. For reviewing conflicts and rejections. Roles admin and ops; HO users with an area scope
        are not allowed (commands carry no district). Per-FA last sync time is on the FA record (identity). Commands the server
        failed to apply carry failed_attempts and last_error; dead-lettered ones are rejected with error "server_could_not_apply".
        Applied and merged commands are kept 180 days, conflicts and rejections a year.
      tags:
      - sync
      parameters:
      - name: fa_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CommandStatus'
      - name: type
        in: query
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
      - name: from
        in: query
        description: Inclusive lower bound on received_at (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive upper bound on received_at (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of stored commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredCommandPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/visits:
    get:
      operationId: listVisits
      summary: Search visits
      description: Newest first (by visit time, or the planned day for visits not logged). Roles admin, ops, agronomy. Every
        filter is optional.
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/FAFilter'
      - name: farmer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/VisitStatus'
      - name: from
        in: query
        description: First day, inclusive (visit day in IST, or planned day).
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Last day, inclusive.
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of visits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/visits/counts:
    get:
      operationId: getVisitCounts
      summary: Visit counts per FA for a date range (dashboard)
      description: planned = visits scheduled for a day in the range (not cancelled); done = visits logged on a day in the
        range; missed = scheduled in the range and the day passed without a log; farmers_visited = distinct farmers among
        done. Only FAs with at least one visit are listed. Range at most 366 days. All HO roles. district_id narrows to one
        district (the visit's district is the farmer's); HO users with an area scope get 403 for a district outside it. With
        group_by=day, days also carries one entry per day of the range (zero-filled, oldest first) summed over the FAs that
        match, for the overview chart; days is null otherwise.
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FAFilter'
      - name: district_id
        in: query
        schema:
          type: string
          format: uuid
      - name: group_by
        in: query
        description: fa (default) = per-FA items only; day = per-FA items plus the daily series.
        schema:
          type: string
          enum:
          - fa
          - day
          x-enum-varnames:
          - GroupByFA
          - GroupByDay
          default: fa
      responses:
        '200':
          description: Counts per FA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/visits/overdue:
    get:
      operationId: listOverdueVisits
      summary: Due and missed visits
      description: Planned visits whose day has passed without a log (status missed, or still planned before the nightly job
        ran), most recent day first. Roles admin, ops, agronomy.
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/FAFilter'
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of overdue visits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/visits/sample:
    get:
      operationId: sampleVisits
      summary: Random sample of logged visits for QA review
      description: Draws a uniform random sample of logged visits whose visit day is in [from, to]. The drawn visit IDs are
        written to the audit log. Roles admin, ops, agronomy.
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FAFilter'
      - name: size
        in: query
        description: Number of visits to draw, default 20, maximum 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: The sample (fewer items if fewer visits match).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/visits/{visit_id}:
    get:
      operationId: getVisit
      summary: Visit detail with issues, advice and photos
      description: Photo URLs are presigned GETs valid for 15 minutes. Roles admin, ops, agronomy.
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/VisitID'
      responses:
        '200':
          description: The visit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/app-config:
    get:
      operationId: getAppConfig
      summary: App release settings (forced update, feature flags)
      description: Read by the farmer and FA apps at start, before sign-in. An app whose version is below min_version must
        stop and send the user to store_url. latest_version is never below min_version; an app below it may offer the update.
        flags are feature switches (unknown flags must be ignored). The values come from server config and change rarely,
        so the response is cacheable for 5 minutes. The device heartbeats also return min_version.
      tags:
      - auth
      security: []
      parameters:
      - name: app
        in: query
        required: true
        schema:
          type: string
          enum:
          - farmer
          - fa
      responses:
        '200':
          description: Release settings.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/fa/login:
    post:
      operationId: faLogin
      summary: FA sign-in with login ID and password
      description: Registers or refreshes the device. Any failure (unknown ID, wrong password, inactive login) is 401 `unauthorized`
        with the same message; a revoked device is 401 `device_revoked`; a correct temporary password older than 72 hours
        is 401 `temp_password_expired`. When must_change_password is true the token only works for POST /v1/fa/me/password
        (403 `password_change_required` elsewhere).
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FALogin'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FASession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/login:
    post:
      operationId: hoLogin
      summary: HO sign-in with email, password and TOTP
      description: 'Two-step sign-in is required for every HO user. Wrong email/password/code is 401 `unauthorized` (one message
        for all). If the user has not set up TOTP yet the response is 401 `totp_enrolment_required` (only after a correct
        password): call /v1/auth/ho/totp/start then /confirm. A correct temporary password older than 72 hours is 401 `temp_password_expired`.'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HOLogin'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HOSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/totp/confirm:
    post:
      operationId: confirmTotpEnrolment
      summary: Confirm TOTP set-up with a code and sign in
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
      responses:
        '200':
          description: TOTP enabled and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HOSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/ho/totp/start:
    post:
      operationId: startTotpEnrolment
      summary: Start TOTP set-up (first sign-in, or after an admin reset)
      description: Checks email + password and returns a new secret as an otpauth:// URL for the authenticator app. Calling
        it again replaces the pending secret. Refused (409 `totp_already_enabled`) once TOTP is set up; an admin must reset
        it first.
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpStart'
      responses:
        '200':
          description: Pending secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out (revoke the session)
      description: Revokes the session of the bearer access token, or of the refresh token in the body. Always 204, also when
        the session is unknown or already revoked.
      tags:
      - auth
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Send a sign-in OTP to a farmer's phone
      description: Sends a 6-digit code by SMS (Telugu by default). A new request replaces the previous code. Limited per
        phone (one every 30 s, a few per hour) and per IP. The response never says whether the phone is already registered.
        When the server has the farmer app's signature hash configured, the SMS is in the Android SMS Retriever format ("<#>"
        first, the 11-character hash on the last line), so the app can read the code without a tap; otherwise use the SMS
        User Consent API.
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify the OTP and sign the farmer in
      description: 'On success the farmer record is found or created (self sign-up), the device is registered and a session
        is created. Errors: 400 `otp_invalid` (wrong code, details.attempts_left) or `otp_expired` (no live code, expired,
        used, or too many wrong tries: request a new one); 401 `device_revoked` (wipe and use a new install ID).'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Swap a refresh token for a new token pair
      description: 'Refresh tokens rotate: each is accepted once. A retry with the token just rotated (lost response on a
        slow network, or two parallel refreshes) within 60 seconds, while its successor is still unused, returns that same
        successor refresh token with a fresh access token. Any other reuse of a rotated token revokes the whole session family
        (401 `refresh_reused`). Also 401 when the session expired or was revoked, the device was revoked (`device_revoked`),
        the login was deactivated, or the temporary password expired (`temp_password_expired`). The new access token reflects
        the account as it is now (role, area, must-change flag).'
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/web/notices/{notice_id}:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    get:
      operationId: getWebNotice
      summary: A notice for the farmer web page opened from an SMS or WhatsApp link
      description: Needs the signed link token (kind web, purpose "notice:<notice_id>") as ?t= or bearer. audio_url is a short-lived
        presigned URL for the voice note.
      tags:
      - inbox
      parameters:
      - name: t
        in: query
        description: Signed link token (alternative to the Authorization header).
        schema:
          type: string
          maxLength: 2048
      responses:
        '200':
          description: The notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/web/notices/{notice_id}/listened:
    parameters:
    - $ref: '#/components/parameters/NoticeID'
    post:
      operationId: markWebNoticeListened
      summary: Record a play of the voice note on the web page (idempotent)
      tags:
      - inbox
      parameters:
      - name: t
        in: query
        description: Signed link token (alternative to the Authorization header).
        schema:
          type: string
          maxLength: 2048
      responses:
        '204':
          description: Marked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    AdminFarmerListItem:
      type: object
      required:
      - id
      - name
      - name_te
      - phone_masked
      - language
      - source
      - plan
      - status
      - village
      - assigned_fa
      - active_crop_ids
      - total_area_acres
      - plot_count
      - programme_consent
      - consent_pending
      - consents_granted
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        name_te:
          type: string
          nullable: true
        phone_masked:
          type: string
          example: +91******2345
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          enum:
          - self
          - fa
          - ho
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/FarmerStatus'
        village:
          allOf:
          - $ref: '#/components/schemas/FarmerVillage'
          nullable: true
        assigned_fa:
          allOf:
          - $ref: '#/components/schemas/FarmerFARef'
          nullable: true
        active_crop_ids:
          type: array
          items:
            type: string
            format: uuid
        total_area_acres:
          type: number
          format: double
        plot_count:
          type: integer
          format: int32
        programme_consent:
          type: boolean
          nullable: true
          description: Current programme consent; null = never asked.
        consent_pending:
          type: boolean
          description: No programme consent recorded yet (an FA enrolment without a verified consent OTP, or a self sign-up
            that has not answered).
        consents_granted:
          type: integer
          description: Purposes currently granted (of 4).
        created_at:
          type: string
          format: date-time
    AdminFarmerPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminFarmerListItem'
        next_cursor:
          type: string
          nullable: true
    AdminUpdateFarmerRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        name_te:
          type: string
          minLength: 1
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        village_id:
          type: string
          format: uuid
        phone:
          type: string
          minLength: 10
          maxLength: 20
        plan:
          $ref: '#/components/schemas/Plan'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required when plan changes (admin only; no payment until Phase 2).
    Advice:
      type: object
      description: 'Salt-first advice as given on the visit (copied at log time from the rule the FA picked). product_* and
        sku_id are null when no Shanmukha product maps to the salt (salt_only = true): the farmer is told the salt name only.
        When the issue''s advice_status is unresolved every field is null (the server could not confirm the FA''s rule).'
      required:
      - rule_id
      - rule_version
      - salt_id
      - salt_name
      - salt_name_te
      - sku_id
      - product_name
      - product_name_te
      - dose
      - dose_te
      - salt_only
      properties:
        rule_id:
          type: string
          format: uuid
          nullable: true
          description: The exact advisory rule version used.
        rule_version:
          type: integer
          format: int32
          nullable: true
        salt_id:
          type: string
          format: uuid
          nullable: true
        salt_name:
          type: string
          nullable: true
        salt_name_te:
          type: string
          nullable: true
        sku_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        product_name_te:
          type: string
          nullable: true
        dose:
          type: string
          nullable: true
          description: Dose per acre, English.
        dose_te:
          type: string
          nullable: true
        salt_only:
          type: boolean
    Advisory:
      type: object
      required:
      - id
      - sender
      - title_te
      - body_te
      - title_en
      - body_en
      - audio_key
      - image_key
      - audio_url
      - image_url
      - names_product
      - class
      - target
      - channels
      - status
      - scheduled_for
      - sent_at
      - recipient_count
      - created_by
      - updated_by
      - approved_by
      - approved_at
      - review_note
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          enum:
          - ho
          - civ
        title_te:
          type: string
        body_te:
          type: string
        title_en:
          type: string
          nullable: true
        body_en:
          type: string
          nullable: true
        audio_key:
          type: string
          nullable: true
        image_key:
          type: string
          nullable: true
        audio_url:
          type: string
          nullable: true
          description: Presigned GET URL for the voice note (short-lived), if uploaded.
        image_url:
          type: string
          nullable: true
        names_product:
          type: boolean
        class:
          type: string
          enum:
          - service
          - promotional
        target:
          $ref: '#/components/schemas/AdvisoryTarget'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AdvisoryChannel'
        status:
          $ref: '#/components/schemas/AdvisoryStatus'
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        recipient_count:
          type: integer
          nullable: true
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: Who last edited the draft (null if never edited after creation).
        approved_by:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        review_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/AdvisoryStats'
    AdvisoryChannel:
      type: string
      enum:
      - push
      - sms
      - whatsapp
      - in_app
      description: 'in_app is always on (every recipient gets a notice in My Crop Advisory); push, sms and whatsapp add deliveries.
        The SMS is a fixed DLT template: the title (cut to 30 characters) and a link to the advisory''s web page with the
        full text and voice note; the advisory text itself is not in the SMS. No WhatsApp provider is integrated yet: whatsapp
        deliveries are recorded as skipped with error whatsapp_not_configured and nothing is sent.'
    AdvisoryCreate:
      type: object
      required:
      - title_te
      - body_te
      - target
      - channels
      properties:
        sender:
          type: string
          enum:
          - ho
          - civ
          default: ho
        title_te:
          type: string
          minLength: 1
          maxLength: 120
        body_te:
          type: string
          minLength: 1
          maxLength: 2000
        title_en:
          type: string
          minLength: 1
          maxLength: 120
        body_en:
          type: string
          minLength: 1
          maxLength: 2000
        names_product:
          type: boolean
          default: false
          description: True if the advisory names a Shanmukha product. Needs Agronomy approval and is promotional. The server
            also scans title and text for product and salt names and refuses false when one appears; set it yourself when
            only the audio or image names a product.
        class:
          type: string
          enum:
          - service
          - promotional
          description: Defaults to promotional when names_product is true, otherwise service.
        target:
          $ref: '#/components/schemas/AdvisoryTarget'
        channels:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdvisoryChannel'
        audio_content_type:
          type: string
          enum:
          - audio/mpeg
          - audio/mp4
          - audio/aac
          - audio/ogg
          - audio/wav
          description: Set to get an upload URL for a voice note.
        image_content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          description: Set to get an upload URL for an image.
    AdvisoryCreated:
      type: object
      required:
      - advisory
      - audio_upload
      - image_upload
      properties:
        advisory:
          $ref: '#/components/schemas/Advisory'
        audio_upload:
          allOf:
          - $ref: '#/components/schemas/Upload'
          nullable: true
        image_upload:
          allOf:
          - $ref: '#/components/schemas/Upload'
          nullable: true
    AdvisoryPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Advisory'
        next_cursor:
          type: string
          nullable: true
    AdvisoryPreview:
      type: object
      required:
      - recipient_count
      properties:
        recipient_count:
          type: integer
    AdvisoryPreviewRequest:
      type: object
      required:
      - target
      properties:
        target:
          $ref: '#/components/schemas/AdvisoryTarget'
    AdvisoryReject:
      type: object
      required:
      - note
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
    AdvisoryStats:
      type: object
      required:
      - notices
      - read
      - listened
      - deliveries
      properties:
        notices:
          type: integer
        read:
          type: integer
        listened:
          type: integer
        deliveries:
          type: object
          description: 'Delivery counts keyed "<channel>.<status>", e.g. {"sms.sent": 120, "sms.failed": 3}.'
          additionalProperties:
            type: integer
    AdvisoryStatus:
      type: string
      enum:
      - draft
      - pending_approval
      - scheduled
      - sending
      - sent
      - cancelled
    AdvisorySubmit:
      type: object
      properties:
        send_at:
          type: string
          format: date-time
          nullable: true
          description: When to send; omit or null to send now. SMS and push wait for 07:00 IST during quiet hours (21:00-07:00),
            also when a retry falls in them. At send time a farmer who was deactivated (or, for promotional advisories, withdrew
            programme consent) is skipped.
    AdvisoryTarget:
      type: object
      description: Recipients must match every non-empty list (AND across lists, any-of within a list); an empty or missing
        list means any. For example district_ids [Kadapa] with village_ids [Kondapur] reaches only Kondapur, and a mandal
        outside the chosen districts reaches nobody. Only active farmers are targeted; promotional advisories also need programme
        consent.
      properties:
        crop_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        district_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        mandal_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        village_ids:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid
        stage_codes:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        plan:
          type: string
          enum:
          - free
          - premium
          nullable: true
    AdvisoryUpdate:
      type: object
      description: Changes to a draft. Absent fields are unchanged.
      properties:
        sender:
          type: string
          enum:
          - ho
          - civ
        title_te:
          type: string
          minLength: 1
          maxLength: 120
        body_te:
          type: string
          minLength: 1
          maxLength: 2000
        title_en:
          type: string
          maxLength: 120
          description: '"" removes the English title.'
        body_en:
          type: string
          maxLength: 2000
          description: '"" removes the English text.'
        names_product:
          type: boolean
        class:
          type: string
          enum:
          - service
          - promotional
          description: When absent, derived again from names_product.
        target:
          $ref: '#/components/schemas/AdvisoryTarget'
        channels:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdvisoryChannel'
        audio_content_type:
          type: string
          enum:
          - audio/mpeg
          - audio/mp4
          - audio/aac
          - audio/ogg
          - audio/wav
          description: Replace the voice note; the response has the upload URL.
        image_content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          description: Replace the image; the response has the upload URL.
        remove_audio:
          type: boolean
          default: false
        remove_image:
          type: boolean
          default: false
    Allocation:
