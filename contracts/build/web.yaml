openapi: 3.0.3
info:
  title: Orbit web API (HO portal, farmer web pages)
  version: 0.1.0
  description: Generated by tools/bundle-specs.py from contracts/openapi/{audit,farmers,geo,identity,masters,messaging,sync,visits}.yaml.
    Do not edit; edit the module specs and re-run it.
tags:
- name: admin
- name: admin-farmers
- name: advisories
- name: alerts
- name: allocations
- name: audit
- name: auth
  description: Sign-in, refresh and sign-out (no token needed).
- name: devices
  description: App device heartbeat and HO device management.
- name: field-assistants
  description: HO management of FA logins (roles admin, ops).
- name: geo
- name: ho-users
  description: HO users and roles (role admin only, except the name directory).
- name: inbox
- name: masters
- name: sync
security:
- bearerAuth: []
paths:
  /v1/admin/advisories:
    post:
      operationId: createAdvisory
      summary: Create an advisory draft
      description: 'Roles admin, agronomy, ops. HO users with an area scope can only target their own districts: district_ids
        must be a subset of their scope (403 otherwise), and an empty district list becomes their scope. If the title or text
        (Telugu or English) mentions an active product or salt name, names_product must be true (400 validation_failed naming
        the term). When audio_content_type or image_content_type is given, the response carries a presigned upload URL for
        each; upload before submitting.'
      tags:
      - advisories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryCreate'
      responses:
        '201':
          description: The draft and its upload URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listAdvisories
      summary: List advisories
      description: Newest first. HO users with an area scope see advisories targeted inside their districts.
      tags:
      - advisories
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AdvisoryStatus'
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of advisories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/advisories/preview:
    post:
      operationId: previewAdvisoryRecipients
      summary: Count the farmers a target would reach now
      description: 'The count is an estimate: recipients are resolved again when the advisory is sent. Area scope applies
        as for create.'
      tags:
      - advisories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryPreviewRequest'
      responses:
        '200':
          description: Recipient count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/advisories/{advisory_id}:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    get:
      operationId: getAdvisory
      summary: Get an advisory with its reach so far
      tags:
      - advisories
      responses:
        '200':
          description: The advisory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAdvisory
      summary: Edit a draft (including one Agronomy sent back)
      description: 'Only drafts can be edited; an advisory Agronomy rejected is a draft again, with review_note saying why
        (the note stays until it is resubmitted). Absent fields are unchanged; title_en or body_en "" removes the English
        text. The same checks as create apply to the result: area scope on the target, and names_product must be true when
        the text names an active product or salt. The editor is recorded, and the approver must be neither the author nor
        the last editor (409 for any other status). audio_content_type / image_content_type replace the media and return new
        upload URLs; remove_audio / remove_image drop it. Roles admin, agronomy, ops.'
      tags:
      - advisories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryUpdate'
      responses:
        '200':
          description: The edited draft and any new upload URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/advisories/{advisory_id}/approve:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    post:
      operationId: approveAdvisory
      summary: Approve an advisory that names a product (Agronomy)
      description: Role agronomy only, and the approver must not be the author.
      tags:
      - advisories
      responses:
        '200':
          description: The advisory, now scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/advisories/{advisory_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    post:
      operationId: cancelAdvisory
      summary: Cancel an advisory before it starts sending
      tags:
      - advisories
      responses:
        '200':
          description: The cancelled advisory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/advisories/{advisory_id}/recipients:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    get:
      operationId: listAdvisoryRecipients
      summary: Farmers who received an advisory, with delivery status per channel
      tags:
      - advisories
      parameters:
      - name: limit
        in: query
        description: Page size, default 100, maximum 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of recipients, in the order notices were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/advisories/{advisory_id}/reject:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    post:
      operationId: rejectAdvisory
      summary: Send an advisory back to draft with a note (Agronomy)
      tags:
      - advisories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryReject'
      responses:
        '200':
          description: The advisory, back in draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/advisories/{advisory_id}/submit:
    parameters:
    - $ref: '#/components/parameters/AdvisoryID'
    post:
      operationId: submitAdvisory
      summary: Submit a draft to be sent now or at send_at
      description: An advisory that names a product goes to pending_approval and is scheduled when Agronomy approves it; any
        other advisory is scheduled straight away. The product-mention check of create is repeated here (product names may
        have been added since). Omit send_at (or pass a past time) to send as soon as possible. Uploaded audio and image must
        exist. Roles admin, agronomy, ops.
      tags:
      - advisories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorySubmit'
      responses:
        '200':
          description: The advisory after submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/alerts:
    get:
      operationId: listHOAlerts
      summary: HO alerts for the overview (new farmers, farmers without an FA, FAs offline)
      description: Newest first. HO users with an area scope see alerts in their districts only. fa_offline is raised at most
        once a day per active FA that has not synced for 48 hours (district_id is the FA's first allocated district; payload
        has fa_code, fa_name, last_sync_at and all district_ids).
      tags:
      - alerts
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - new_farmer
          - farmer_without_fa
          - fa_offline
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of HO alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HOAlertPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/allocations:
    get:
      operationId: listAllocations
      summary: List FA allocations
      description: Current allocations (valid_to null) unless include_ended. Newest first, keyset paginated. district_id matches
        allocations at or below the district; mandal_id at or below the mandal; village_id village-level allocations of that
        village. Filtered to the caller's area scope.
      tags:
      - allocations
      parameters:
      - name: fa_id
        in: query
        schema:
          type: string
          format: uuid
      - name: district_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mandal_id
        in: query
        schema:
          type: string
          format: uuid
      - name: village_id
        in: query
        schema:
          type: string
          format: uuid
      - name: include_ended
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of allocations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAllocation
      summary: Allocate an FA to a village, mandal or district
      description: 'One current lead per area: allocating a second lead returns 409 area_has_lead (details.fa_id, details.allocation_id
        = the current lead). The same FA twice on one area returns 409 allocation_exists. Admin or ops.'
      tags:
      - allocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/allocations/handover:
    post:
      operationId: handoverAllocations
      summary: Move all of one FA's current allocations to another FA
      description: 'In one transaction, ends every current allocation of from_fa_id and gives to_fa_id the same areas (same
        level and lead flag). If to_fa_id already covers an area it keeps that allocation (upgraded to lead when the old one
        was the lead). Farmers are NOT reassigned here: call the farmers module''s reassign endpoint next with affected_village_ids.
        Calling it again after a successful hand-over moves nothing. Admin or ops.'
      tags:
      - allocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
      responses:
        '200':
          description: Hand-over done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/allocations/{allocation_id}/end:
    post:
      operationId: endAllocation
      summary: End an allocation now
      description: Sets valid_to to now. 409 allocation_ended if it already ended. Admin or ops.
      tags:
      - allocations
      parameters:
      - name: allocation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The ended allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/audit:
    get:
      operationId: listAuditEvents
      summary: Search the audit log
      description: Newest first. Every filter is optional; combine them freely.
      tags:
      - audit
      parameters:
      - name: entity_type
        in: query
        schema:
          type: string
          pattern: ^[a-z][a-z_]{0,63}$
      - name: entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: actor_id
        in: query
        schema:
          type: string
          format: uuid
      - name: farmer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        description: Action prefix, e.g. "farmers." or "masters.rule_".
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: from
        in: query
        description: Inclusive lower bound on occurred_at (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive upper bound on occurred_at (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/audit/chain/{entity_type}/{entity_id}:
    get:
      operationId: getAuditChain
      summary: Full history of one record
      description: Every audit event for one record, oldest first.
      tags:
      - audit
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z_]{0,63}$
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size, default 200, maximum 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the record's audit events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/devices:
    get:
      operationId: listDevices
      summary: Devices of one FA or farmer
      description: Newest first, revoked devices included. Roles admin and ops.
      tags:
      - devices
      parameters:
      - name: subject_kind
        in: query
        required: true
        schema:
          type: string
          enum:
          - fa
          - farmer
      - name: subject_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/devices/{device_id}/revoke:
    post:
      operationId: revokeDevice
      summary: Revoke a device (remote wipe)
      description: Signs out every session on the device and tells the app to wipe itself at its next contact. Revoking an
        already revoked device changes nothing. Roles admin and ops.
      tags:
      - devices
      parameters:
      - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRevoke'
      responses:
        '200':
          description: The revoked device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/fa-alerts:
    post:
      operationId: createHONote
      summary: Send a note to an FA (shows in the FA app's Alerts tab)
      description: Roles admin, agronomy, ops.
      tags:
      - alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HONoteCreate'
      responses:
        '201':
          description: The FA alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAAlert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/farmer-reassignments:
    post:
      operationId: reassignFarmers
      summary: Reassign farmers to another FA
      description: Pick farmers by ID or by village (exactly one of farmer_ids / village_ids). By village, from_fa_id is required
        and only that FA's farmers in those villages move (a territory hand-over must not take other FAs' farmers sharing
        a village). With farmer_ids, from_fa_id is optional and, when given, only farmers currently with that FA move. Inactive
        farmers and farmers already with the FA are skipped. HO users with an area scope move only farmers in their districts,
        and only to an FA with an allocation in those districts (403 otherwise). Farmers are told their new FA by SMS (farmers.reassigned
        event).
      tags:
      - admin-farmers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
      responses:
        '200':
          description: What moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/farmers:
    get:
      operationId: listFarmers
      summary: List farmers
      description: Newest first. Every filter is optional. q matches name (English or Telugu) or, when it has 4+ digits, the
        phone number. Phones are masked in the list.
      tags:
      - admin-farmers
      parameters:
      - name: district_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mandal_id
        in: query
        schema:
          type: string
          format: uuid
      - name: village_id
        in: query
        schema:
          type: string
          format: uuid
      - name: fa_id
        in: query
        schema:
          type: string
          format: uuid
      - name: unassigned
        in: query
        description: Only farmers with no FA.
        schema:
          type: boolean
      - name: crop_id
        in: query
        description: Crop of an active season.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/FarmerStatus'
      - name: plan
        in: query
        schema:
          $ref: '#/components/schemas/Plan'
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: limit
        in: query
        description: Page size, default 50, maximum 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of farmers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFarmerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/farmers/stats:
    get:
      operationId: getFarmerStats
      summary: Farmer numbers for the overview
      description: ADM-01. Counts within the caller's districts (HO users with an area scope), or one district. total excludes
        deactivated farmers; consent_pending counts farmers (not deactivated) with no programme consent recorded yet; new_last_7_days
        counts farmers registered in the last 7 days; unassigned counts active farmers with no FA.
      tags:
      - admin-farmers
      parameters:
      - name: district_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
