        village_id:
          type: string
          format: uuid
          nullable: true
        mandal_id:
          type: string
          format: uuid
          nullable: true
        mandal_name:
          type: string
          nullable: true
        mandal_name_te:
          type: string
          nullable: true
        district_id:
          type: string
          format: uuid
