      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_te:
          type: string
          nullable: true
        lgd_code:
          type: string
          nullable: true
        village_count:
          type: integer
        mandals:
          type: array
          items:
            $ref: '#/components/schemas/TreeMandal'
    TreeMandal:
      type: object
      required:
      - id
      - name
      - name_te
      - lgd_code
      - village_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_te:
          type: string
          nullable: true
        lgd_code:
          type: string
          nullable: true
        village_count:
          type: integer
    Upload:
      type: object
      required:
      - url
      - method
      - headers
      - expires_at
      properties:
        url:
          type: string
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    Village:
      type: object
      description: A village with its mandal and district (names in English and Telugu).
      required:
      - id
      - name
      - name_te
      - lgd_code
      - lat
      - lng
      - mandal_id
      - mandal_name
      - mandal_name_te
      - district_id
      - district_name
      - district_name_te
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Kondapur
        name_te:
          type: string
          nullable: true
          example: కొండాపూర్
        lgd_code:
          type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
          description: Centroid latitude (WGS 84), null when unknown.
        lng:
          type: number
          format: double
          nullable: true
        mandal_id:
          type: string
          format: uuid
        mandal_name:
          type: string
        mandal_name_te:
          type: string
          nullable: true
        district_id:
          type: string
          format: uuid
        district_name:
          type: string
        district_name_te:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    VillageCreate:
      type: object
      required:
      - mandal_id
      - name
      additionalProperties: false
      properties:
        mandal_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/PlaceName'
        name_te:
          $ref: '#/components/schemas/PlaceName'
        lgd_code:
          $ref: '#/components/schemas/LGDCode'
        lat:
          $ref: '#/components/schemas/Latitude'
        lng:
          $ref: '#/components/schemas/Longitude'
    VillageImportResult:
      type: object
      required:
      - rows
      - created
      - updated
      - unchanged
      - districts_created
      - mandals_created
      properties:
        rows:
          type: integer
          description: Data rows read (header excluded).
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        districts_created:
          type: integer
        mandals_created:
          type: integer
    VillagePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Village'
        next_cursor:
          type: string
          nullable: true
          description: Pass as ?cursor= to get the next page; null on the last page.
    VillageUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/PlaceName'
        name_te:
          $ref: '#/components/schemas/PlaceName'
        lgd_code:
          $ref: '#/components/schemas/LGDCode'
        lat:
          $ref: '#/components/schemas/Latitude'
        lng:
          $ref: '#/components/schemas/Longitude'
    Visit:
      type: object
      required:
      - id
      - farmer_id
      - farmer_name
      - farmer_name_te
      - farmer_phone_masked
      - village_id
      - village_name
      - village_name_te
      - plot_id
      - season_id
      - fa_id
      - fa_name
      - status
      - planned_for
      - planned_slot
      - purpose
      - visited_at
      - location
      - farmer_present
      - stage_id
      - stage_name
      - stage_name_te
      - notes
      - photo_count
      - issues
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        farmer_id:
          type: string
          format: uuid
        farmer_name:
          type: string
          nullable: true
          description: The farmer's current name (null if the farmers lookup is unavailable).
        farmer_name_te:
          type: string
          nullable: true
        farmer_phone_masked:
          type: string
          nullable: true
          example: +91******2345
        village_id:
          type: string
          format: uuid
          nullable: true
          description: The farmer's current village.
        village_name:
          type: string
          nullable: true
        village_name_te:
          type: string
          nullable: true
        plot_id:
          type: string
          format: uuid
        season_id:
          type: string
          format: uuid
        fa_id:
          type: string
          format: uuid
        fa_name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/VisitStatus'
        planned_for:
          type: string
          format: date
          nullable: true
        planned_slot:
          allOf:
          - $ref: '#/components/schemas/PlannedSlot'
          nullable: true
        purpose:
          type: string
          nullable: true
        visited_at:
          type: string
          format: date-time
          nullable: true
        location:
          allOf:
          - $ref: '#/components/schemas/VisitLatLng'
          nullable: true
        farmer_present:
          type: boolean
          nullable: true
        stage_id:
          type: string
          format: uuid
          nullable: true
        stage_name:
          type: string
          nullable: true
        stage_name_te:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        photo_count:
          type: integer
          format: int32
        issues:
          type: array
          items:
            $ref: '#/components/schemas/VisitIssue'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VisitCounts:
      type: object
      required:
      - from
      - to
      - items
      - days
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/FAVisitCounts'
        days:
          type: array
          nullable: true
          description: Only with group_by=day; null otherwise.
          items:
            $ref: '#/components/schemas/DayVisitCounts'
    VisitDetail:
      type: object
      required:
      - visit
      - photos
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VisitPhoto'
    VisitIssue:
      type: object
      required:
      - id
      - issue_id
      - issue_name
      - issue_name_te
      - severity
      - advice_status
      - requested_rule_id
      - unresolved_reason
      - advice
      properties:
        id:
          type: string
          format: uuid
        issue_id:
          type: string
          format: uuid
        issue_name:
          type: string
          nullable: true
        issue_name_te:
          type: string
          nullable: true
        severity:
          $ref: '#/components/schemas/Severity'
        advice_status:
          type: string
          enum:
          - given
          - unresolved
          description: 'unresolved: the rule the FA picked offline was not an approved (or superseded) rule for this issue,
            so no advice is recorded. The visit is kept; HO follows up.'
        requested_rule_id:
          type: string
          format: uuid
          nullable: true
          description: The advisory_rule_id the FA app sent.
        unresolved_reason:
          type: string
          nullable: true
        advice:
          $ref: '#/components/schemas/Advice'
    VisitLatLng:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    VisitPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
        next_cursor:
          type: string
          nullable: true
    VisitPhoto:
      type: object
      required:
      - id
      - visit_id
      - content_type
      - bytes
      - uploaded_at
      - url
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
        content_type:
          type: string
        bytes:
          type: integer
          format: int32
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the phone has uploaded it.
        url:
          type: string
          nullable: true
          description: Presigned GET URL (HO only, once uploaded).
    VisitSample:
      type: object
      required:
      - from
      - to
      - size
      - items
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        size:
          type: integer
          description: Requested sample size.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
    VisitStatus:
      type: string
      enum:
      - planned
      - done
      - cancelled
      - missed
  parameters:
    ActiveFilter:
      name: active
      in: query
      description: Only active (true) or only inactive (false) rows; omit for both.
      schema:
        type: boolean
    AdvisoryID:
      name: advisory_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CropID:
      name: crop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 200
    DealerID:
      name: dealer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DistrictID:
      name: district_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FAFilter:
      name: fa_id
      in: query
      description: Only this FA's visits.
      schema:
        type: string
        format: uuid
    FAID:
      name: fa_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromDate:
      name: from
      in: query
      required: true
      description: First day, inclusive (IST).
      schema:
        type: string
        format: date
    IssueID:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit200:
      name: limit
      in: query
      description: Page size, default 50, maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    MandalID:
      name: mandal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeID:
      name: notice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleID:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaltID:
      name: salt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: q
      in: query
      description: Case-insensitive name (or code) substring.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SkuID:
      name: sku_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ToDate:
      name: to
      in: query
      required: true
      description: Last day, inclusive (IST).
      schema:
        type: string
        format: date
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VillageID:
      name: village_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VillageQuery:
      name: q
      in: query
      description: Part of the village name, in English or Telugu.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    VisitID:
      name: visit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict (version mismatch, duplicate, wrong status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
